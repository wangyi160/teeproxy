# Merge these sections into your Codex user config; preserve existing settings.
# Only teeproxy holds the real router key; no local CA or HTTP proxy is needed.
# TEEPROXY_AGENT_KEY is a placeholder unless client_key_env is configured.
[model_providers.teeproxy]
name = "teerouter via teeproxy"
base_url = "http://127.0.0.1:8899/v1"
env_key = "TEEPROXY_AGENT_KEY"
wire_api = "responses"
supports_websockets = false
requires_openai_auth = false

[profiles.teeproxy]
model_provider = "teeproxy"
