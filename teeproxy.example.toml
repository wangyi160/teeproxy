# Agent API base URL: http://127.0.0.1:8899/v1
# Use a local interface IP, 0.0.0.0, or [::] for network access; API key authentication is always required.
listen = "127.0.0.1:8899"
router = "https://YOUR-APP-8443s.YOUR-CLUSTER.phala.network"
router_key_env = "TEEPROXY_ROUTER_KEY"
# CLI only: existing enrolled 32-byte Ed25519 seed as 64 hex characters. Never upload it.
user_signing_seed_env = "TEEPROXY_USER_SIGNING_SEED"
# Replace this empty allowlist with an independently reviewed release policy.
tdx_policy = "policy/tdx-deny-all.json"
# Required local API key; send as Bearer, x-api-key or x-goog-api-key.
client_key_env = "TEEPROXY_CLIENT_KEY"
# Required for generation in fixed mode; use the full pool ID from the management inventory.
# pool = "m_MERCHANT.selected-pool"
max_in_flight = 16
max_connections = 128
# Wait for the first response (including model reasoning), independent of stream idle time.
response_header_timeout_secs = 300
stream_idle_secs = 120

# Both modes send routing rules to the attested router (default maximum 1x).
# [routing]
# automatic = false # true selects an authorized pool for the agent's exact model
# max_multiplier_millionths = 500000 # maximum 0.5x the official base price
# priority = "price" # price or speed (router-side measurements of real streaming calls)

# Model discovery reads this management platform, never Router.
management_url = "https://teerouter.org"
