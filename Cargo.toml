[package]
name = "teeproxy"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Local API gateway with independent TEE attestation for teerouter"
repository = "https://github.com/wangyi160/teeproxy"
license = "MIT"
readme = "README.md"

[features]
default = ["tdx-verifier"]
tdx-verifier = ["dep:dcap-qvl"]
snp-verifier = ["dep:sev", "dep:openssl"]

[dependencies]
anyhow = "1"
bytes = "1"
dcap-qvl = { version = "=0.6.5", default-features = false, features = ["std", "ring", "report", "default-x509"], optional = true }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.2"
http-body-util = "0.1"
http = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.9"
x509-parser = "0.18"
zeroize = "1"
sev = { version = "=8.0.0", default-features = false, features = ["snp", "serde", "openssl"], optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
